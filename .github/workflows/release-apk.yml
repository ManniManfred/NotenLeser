name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode must increase with every release; use the run number.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – es wird eine Debug-signierte APK erstellt."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; DIR=release; else TASK=assembleDebug; DIR=debug; fi
          ./gradlew --no-daemon "$TASK" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          APK=$(ls app/build/outputs/apk/$DIR/*.apk | head -n 1)
          cp "$APK" "NotenLeser-${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: NotenLeser-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
