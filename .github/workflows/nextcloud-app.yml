name: Nextcloud-App

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'nextcloud/**'
      - '.github/workflows/nextcloud-app.yml'
  pull_request:
    paths:
      - 'nextcloud/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Als Release veröffentlichen: Versionsnummer wie in appinfo/info.xml (z. B. 0.3.0); leer = nur bauen'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: nextcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextcloud/package-lock.json
      - name: PHP-Syntax prüfen
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: notenleser-nextcloud
          path: nextcloud/build/notenleser-*.tar.gz
      # A tag v<version>, or a manual run with a version, publishes a GitHub release with the Nextcloud package.
      # The version must match appinfo/info.xml; a manual run creates the tag itself.
      - name: Versionsnummer prüfen
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          WANTED: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$version" = "$WANTED" || { echo "$WANTED passt nicht zu Version $version in appinfo/info.xml"; exit 1; }
          echo "tag=$WANTED" >> "$GITHUB_OUTPUT"
      - name: GitHub-Release anlegen
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NotenLeser ${{ steps.release.outputs.tag }}
          files: nextcloud/build/notenleser-*.tar.gz
          generate_release_notes: true
