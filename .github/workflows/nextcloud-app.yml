name: Nextcloud-App

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'nextcloud/**'
      - '.github/workflows/nextcloud-app.yml'
  pull_request:
    paths:
      - 'nextcloud/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: nextcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextcloud/package-lock.json
      - name: PHP-Syntax prüfen
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: notenleser-nextcloud
          path: nextcloud/build/notenleser-*.tar.gz
      # A tag v<version> publishes a GitHub release with the Nextcloud package; the version must match info.xml.
      - name: Versionsnummer prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu Version $version in appinfo/info.xml"; exit 1; }
      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nextcloud/build/notenleser-*.tar.gz
          generate_release_notes: true
