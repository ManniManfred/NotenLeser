name: Nextcloud-App

on:
  push:
    paths:
      - 'nextcloud/**'
      - '.github/workflows/nextcloud-app.yml'
  pull_request:
    paths:
      - 'nextcloud/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextcloud/package-lock.json
      - name: PHP-Syntax prüfen
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: notenleser-nextcloud
          path: nextcloud/build/notenleser-*.tar.gz
